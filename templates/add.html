<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beitrag erstellen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Add new post</h1>
    {% if error %}
        <p role="alert">{{ error }}</p>
    {% endif %}
    <form class="post" action="{{ url_for('add') }}" method="post">
        <p>
            <label for="author">Author</label><br>
            <input type="text" id="author" name="author" value="{{ request.form.get('author', '') }}" required>
        </p>
        <p>
            <label for="title">Title</label><br>
            <input type="text" id="title" name="title" value="{{ request.form.get('title', '') }}" required>
        </p>
        <p>
            <label for="content">Content</label><br>
            <textarea id="content" name="content" rows="8" cols="100" required>{{ request.form.get('content', '') }}</textarea>
        </p>
        <button type="submit">Add post</button>
    </form>
    <a href="{{ url_for('index') }}">Back</a>
</body>
</html>
